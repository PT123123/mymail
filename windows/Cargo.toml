[package]
name = "wmail"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.2.0"
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
imap = "2.4.1"
lettre = { version = "0.11.23", features = ["mime03"] }
mail-parser = "0.11.9"
mime_guess = "2.0.5"
open = "5.4.4"
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls-connector = "0.23.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = "1.18.1"
uuid = { version = "1.26.1", features = ["v4"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
strip = true
lto = "thin"
